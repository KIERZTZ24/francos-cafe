<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francos. Bakes and Brews - Menu</title>
    <!-- Instant Theme Loader para walang white flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .search-box-container {
            max-width: 500px;
            margin: 0 auto 20px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            width: 100%;
            padding: 12px 18px 12px 48px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent-color);
        }
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 15px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        /* Floating Scroll Up Button */
        #scrollTopBtn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 999;
            transition: transform 0.2s ease;
        }
        #scrollTopBtn:hover {
            transform: scale(1.08);
            background: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.jpg" alt="Francos Logo" style="height: 42px; border-radius: 6px; object-fit: contain;">
            <span>Francos<span>.</span></span>
        </div>
        <nav class="nav-links">
            <!-- Dynamic navbar handled by script.js -->
        </nav>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <span class="eyebrow" style="color: var(--accent-color); font-weight: 700; font-size: 11px; letter-spacing: 1px;">EXPLORE OUR BREWS</span>
        <h1>Official Menu & Offerings</h1>
        <p>Handcrafted espresso, oat milk specials, Japanese Uji matcha, and mobile event packages.</p>
    </section>

    <!-- Search Input -->
    <div class="search-box-container" style="padding: 0 15px;">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="menu-search-input" class="search-input" placeholder="Search drinks (e.g. Matcha, Spanish, Oat, Frappe)..." oninput="handleMenuSearch(this.value)">
    </div>

    <!-- Category Filter Buttons -->
    <div class="filter-container" style="flex-wrap: wrap; padding: 0 15px;">
        <button class="filter-btn active" onclick="setActiveFilter(this, 'all')"><i class="fa-solid fa-list"></i> All Items</button>
        <button class="filter-btn" onclick="setActiveFilter(this, 'sleepless')"><i class="fa-solid fa-mug-hot"></i> Sleepless</button>
        <button class="filter-btn" onclick="setActiveFilter(this, 'sogreen')"><i class="fa-solid fa-leaf"></i> So Green</button>
        <button class="filter-btn" onclick="setActiveFilter(this, 'snow')"><i class="fa-solid fa-snowflake"></i> Snow Frappes</button>
        <button class="filter-btn" onclick="setActiveFilter(this, 'sweettooth')"><i class="fa-solid fa-cookie"></i> Sweet Tooth</button>
        <button class="filter-btn" onclick="setActiveFilter(this, 'fruitfaves')"><i class="fa-solid fa-lemon"></i> Fruit Faves</button>
        <button class="filter-btn" onclick="setActiveFilter(this, 'package')"><i class="fa-solid fa-truck-ramp-box"></i> Event Packages</button>
    </div>

    <!-- Dynamic Menu Items Grid -->
    <div class="menu-container">
        <div class="menu-grid" id="menu-grid">
            <!-- Rendered dynamically via assets/script.js -->
        </div>
    </div>

    <!-- Floating Scroll To Top Button -->
    <button id="scrollTopBtn" onclick="scrollToTop()" title="Scroll to top"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Added to cart!</div>

    <footer>
        <p>&copy; 2026 Francos. Bakes and Brews · Static Frontend Version</p>
    </footer>

    <script src="assets/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setupScrollTopButton();
        });

        let currentActiveCategory = "all";
        let currentSearchQuery = "";

        function setActiveFilter(btn, category) {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentActiveCategory = category;
            renderMenu(currentActiveCategory, currentSearchQuery);
        }

        function handleMenuSearch(query) {
            currentSearchQuery = query.toLowerCase().trim();
            renderMenu(currentActiveCategory, currentSearchQuery);
        }

        function setupScrollTopButton() {
            let btn = document.getElementById("scrollTopBtn");
            window.onscroll = function() {
                if (document.body.scrollTop > 350 || document.documentElement.scrollTop > 350) {
                    btn.style.display = "flex";
                } else {
                    btn.style.display = "none";
                }
            };
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
