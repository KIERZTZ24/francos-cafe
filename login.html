<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francos. Bakes and Brews - Login</title>
    <!-- Instant Theme Loader para walang white flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
            <img src="assets/images/logo.jpg" alt="Francos Logo" style="height: 42px; border-radius: 6px; object-fit: contain;">
            <span>Francos<span>.</span></span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="promo.html">Promos</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <!-- Login Container -->
    <div class="auth-container">
        <div class="auth-card">
            <h2>Account Login</h2>
            <p>Enter your details below to log in.</p>
            
            <form id="login-form" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="name@example.com" value="">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••" value="">
                </div>
                <div class="form-group">
                    <label>Login As</label>
                    <select id="login-role">
                        <option value="customer">Customer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="auth-btn">Login</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Francos. Bakes and Brews · Static Frontend Version</p>
    </footer>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast"></div>

    <script src="assets/script.js"></script>
    <script>
        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const role = document.getElementById("login-role").value;
            
            let userObj = { name: "Valued Customer", email: email, role: role };
            if (role === "admin") {
                userObj.name = "Store Administrator";
            }
            
            localStorage.setItem("currentUser", JSON.stringify(userObj));
            showToast("Login successful! Redirecting...");
            
            setTimeout(() => {
                if (role === "admin") {
                    window.location.href = "admin/dashboard.html";
                } else {
                    window.location.href = "index.html";
                }
            }, 1000);
        }
    </script>
</body>
</html>
