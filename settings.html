<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francos. Bakes and Brews - Settings</title>
    <!-- Instant Anti-Flash Script para HINDI mag-blink ng puti -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
            color: var(--text-color);
        }

        .settings-card label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
        }

        .settings-card input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .settings-card input:focus {
            border-color: var(--accent-color);
        }

        .btn-save-settings {
            width: 100%;
            padding: 13px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(212, 122, 36, 0.3);
        }

        .btn-save-settings:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="assets/images/logo.jpg" alt="Francos Logo">
            <span>Francos<span>.</span></span>
        </div>
        <nav class="nav-links"></nav>
    </header>

    <section class="page-header">
        <span class="eyebrow" style="color: var(--accent-color); font-weight: 800; font-size: 11px; letter-spacing: 1.5px;">PREFERENCES & ACCOUNT</span>
        <h1>Edit Settings & Details</h1>
        <p>Update your personal information, security password, and contact details.</p>
    </section>

    <div class="container" id="settings-content" style="max-width: 580px; margin: 0 auto 60px; padding: 0 20px; display: none;">
        <div class="settings-card">
            <h3 style="font-family: 'DM Serif Display', serif; color: var(--text-color); margin-bottom: 22px; font-size: 21px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-user-pen" style="color: var(--accent-color);"></i> Edit Account Details
            </h3>
            
            <form id="settings-form" onsubmit="saveAccountSettings(event)">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Full Name</label>
                    <input type="text" id="setting-name" required placeholder="Your full name">
                </div>
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Email Address</label>
                    <input type="email" id="setting-email" required placeholder="name@example.com">
                </div>
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Contact / Phone Number</label>
                    <input type="text" id="setting-phone" placeholder="09XXXXXXXXX">
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label>New Password (Optional)</label>
                    <input type="password" id="setting-password" placeholder="Leave blank to keep current">
                </div>
                
                <button type="submit" class="btn-save-settings">
                    <i class="fa-solid fa-floppy-disk"></i> Save Settings
                </button>
            </form>
        </div>

        <div style="text-align: center;">
            <a href="profile.html" style="color: var(--accent-color); font-weight: bold; text-decoration: none; font-size: 14px;">
                ← Back to My Profile
            </a>
        </div>
    </div>

    <div id="toast" class="toast">Settings updated!</div>

    <footer>
        <p>&copy; 2026 Francos. Bakes and Brews · Static Frontend Version</p>
    </footer>

    <script src="assets/script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentUser = JSON.parse(localStorage.getItem("currentUser"));
            if (!currentUser || !currentUser.email) {
                alert("Please login to access settings.");
                window.location.href = "login.html";
                return;
            }
            document.getElementById("settings-content").style.display = "block";
            document.getElementById("setting-name").value = currentUser.name || "";
            document.getElementById("setting-email").value = currentUser.email || "";
            document.getElementById("setting-phone").value = currentUser.phone || "";
        });

        function saveAccountSettings(e) {
            e.preventDefault();
            let currentUser = JSON.parse(localStorage.getItem("currentUser")) || {};
            currentUser.name = document.getElementById("setting-name").value.trim();
            currentUser.email = document.getElementById("setting-email").value.trim();
            currentUser.phone = document.getElementById("setting-phone").value.trim();
            let newPass = document.getElementById("setting-password").value.trim();
            if (newPass) currentUser.password = newPass;

            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            showToast("Settings updated successfully!");
            setTimeout(() => { window.location.href = "profile.html"; }, 800);
        }
    </script>
</body>
</html>
